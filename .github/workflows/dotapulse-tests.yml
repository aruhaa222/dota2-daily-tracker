name: DotaPulse backend tests

on:
  push:
    branches: ["feature/dotapulse-mvp"]
    paths:
      - "dotapulse/backend/**"
      - ".github/workflows/dotapulse-tests.yml"
  pull_request:
    paths:
      - "dotapulse/backend/**"
      - ".github/workflows/dotapulse-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotapulse/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q
