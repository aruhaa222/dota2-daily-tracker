
name: DotaPulse data refresh

on:
  schedule:
    - cron: '15 8,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dotapulse-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect OpenDota data
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: python scripts/collect.py

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/????-??-??.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh OpenDota snapshot"
            git push
          fi
