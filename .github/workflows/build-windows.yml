name: Build Windows Replay Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/replay_bridge.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DotaPulse-Replay-Bridge desktop/replay_bridge.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DotaPulse-Replay-Bridge-Windows11
          path: dist/DotaPulse-Replay-Bridge.exe
          if-no-files-found: error
          retention-days: 30
